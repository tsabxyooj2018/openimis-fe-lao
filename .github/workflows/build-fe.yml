name: Build and publish frontend image

# Builds this modified openIMIS frontend and publishes it to GHCR.
# The repository is public, so the resulting package is public too and
# Portainer can pull it without registry credentials.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to the openIMIS release)"
        required: false
        default: "26.04"

concurrency:
  group: build-fe-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/openimis-fe-lao
  RELEASE_TAG: ${{ inputs.tag || '26.04' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Confirm the Lao customisations are present
        # apply-overrides.js already fails the build when a label key is missing
        # upstream; this catches the cruder case of the files being dropped,
        # which would otherwise publish a stock-looking image without error.
        run: |
          set -e
          test -f lao/apply-overrides.js
          test -f lao/login-overrides.en.json
          test -f src/emblem-moh.png
          grep -q "apply-overrides.js" Dockerfile
          echo "customisations present"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Prefers a PAT with write:packages if the GHCR_TOKEN secret exists,
          # otherwise the built-in token.
          #
          # GITHUB_TOKEN alone returns 403 on push unless BOTH hold:
          #   - Settings > Actions > General > Workflow permissions is set to
          #     "Read and write permissions", and
          #   - no package of this name already exists that is linked to another
          #     repository (or to no repository at all)
          # A PAT sidesteps both.
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Diagnose GHCR permissions
        # Prints only which actions GHCR grants, never the token itself.
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$GHCR_TOKEN" ]; then
            echo "credential: GHCR_TOKEN secret (PAT)"
            PASS="$GHCR_TOKEN"
          else
            echo "credential: built-in GITHUB_TOKEN"
            PASS="$GH_TOKEN"
          fi

          echo "actor:  ${{ github.actor }}"
          echo "owner:  ${{ github.repository_owner }}"
          echo "image:  ${{ env.IMAGE_NAME }}"

          # Ask GHCR for a token scoped to pull AND push, then read back what it
          # actually granted. If "push" is missing, the credential is the problem;
          # if push is granted, the package itself is blocking us.
          T=$(curl -sS -u "${{ github.actor }}:$PASS" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${{ env.IMAGE_NAME }}:pull,push" \
              | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ -z "$T" ]; then
            echo "could not obtain a GHCR token at all"; exit 0
          fi
          echo -n "granted access: "
          echo "$T" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null \
            | sed -n 's/.*"access":\(\[[^]]*\]\).*/\1/p' || echo "(could not decode)"

          echo "--- existing packages named openimis-fe-lao ---"
          curl -sS -H "Authorization: Bearer $PASS" \
            "https://api.github.com/user/packages?package_type=container" \
            | grep -o '"name":"[^"]*"' | head -20 || echo "(listing unavailable with this credential)"

      - name: Is this commit still the tip of the branch?
        id: tip
        # The release tag is a MOVING tag, and two builds racing for it is not
        # hypothetical: on 2026-08-12 a run for ef63a26 sat queued for twelve
        # minutes, a later push built 41de282 and finished at 01:46:29, then the
        # older run finished at 01:51:47 and repointed :26.04 at the OLDER
        # commit. Both runs reported success and the currency change silently
        # was not in the published image.
        #
        # The concurrency block above did not prevent it, so do not rely on it.
        # Compare against the branch tip at the moment we are about to push
        # instead: a superseded build still publishes its sha- tag, so nothing
        # is lost, it just does not get to move the release tag backwards.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha)
          echo "branch tip: $tip"
          echo "this build: ${{ github.sha }}"
          if [ "$tip" = "${{ github.sha }}" ]; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Release tag not moved::A newer commit ($tip) is on ${{ github.ref_name }}. Publishing the sha- tag only, leaving ${{ env.RELEASE_TAG }} where it is."
          fi

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }},enable=${{ steps.tip.outputs.is_tip }}
            type=sha,format=short

      - name: Free disk space
        # The build pulls node:20 and nginx, installs ~30 npm modules and runs a
        # React production build. A GitHub-hosted runner starts with ~14GB free,
        # which this can exhaust. Removing preinstalled toolchains we do not use
        # reclaims well over 20GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No GHA layer cache: exporting a cache this large frequently fails the
          # step outright, and a cold build is only a few minutes slower.
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
