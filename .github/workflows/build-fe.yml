name: Build and publish frontend image

# Builds this modified openIMIS frontend and publishes it to GHCR.
# The repository is public, so the resulting package is public too and
# Portainer can pull it without registry credentials.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to the openIMIS release)"
        required: false
        default: "26.04"

concurrency:
  group: build-fe-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/openimis-fe-lao
  RELEASE_TAG: ${{ inputs.tag || '26.04' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Confirm the Lao customisations are present
        # apply-overrides.js already fails the build when a label key is missing
        # upstream; this catches the cruder case of the files being dropped,
        # which would otherwise publish a stock-looking image without error.
        run: |
          set -e
          test -f lao/apply-overrides.js
          test -f lao/login-overrides.en.json
          test -f src/emblem-moh.png
          grep -q "apply-overrides.js" Dockerfile
          echo "customisations present"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Prefers a PAT with write:packages if the GHCR_TOKEN secret exists,
          # otherwise the built-in token.
          #
          # GITHUB_TOKEN alone returns 403 on push unless BOTH hold:
          #   - Settings > Actions > General > Workflow permissions is set to
          #     "Read and write permissions", and
          #   - no package of this name already exists that is linked to another
          #     repository (or to no repository at all)
          # A PAT sidesteps both.
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=sha,format=short

      - name: Free disk space
        # The build pulls node:20 and nginx, installs ~30 npm modules and runs a
        # React production build. A GitHub-hosted runner starts with ~14GB free,
        # which this can exhaust. Removing preinstalled toolchains we do not use
        # reclaims well over 20GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No GHA layer cache: exporting a cache this large frequently fails the
          # step outright, and a cold build is only a few minutes slower.
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
